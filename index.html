<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Гульмэн 3D: В поисках утраченного искусства. Экспериментальная браузерная версия с оригинальными локациями, персонажами и музыкой.">
  <title>Гульмэн 3D — В поисках утраченного искусства</title>
  <link rel="stylesheet" href="./style.css?v=20261111-20">
  <link rel="stylesheet" href="./original-ui.css?v=20261109-10">
  <link rel="stylesheet" href="./mobile.css?v=20261111-22">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
  <canvas id="game" aria-label="Игровой мир Гульмэна 3D" tabindex="0"></canvas>
  <main id="menu" aria-label="Меню Гульмэна"><p role="status" style="position:absolute;inset:45% 16px auto;text-align:center;color:#e7d2a0;font:24px Georgia,serif">Загрузка Гульмэна…</p></main>
  <section id="resource-error" hidden aria-label="Загрузка ресурсов">
    <div class="resource-error-content">
      <h1>Гульмэн 3D</h1><p id="status" role="status">Подготовка игры…</p>
      <div id="import-panel" hidden>
        <p>Выбери подготовленный пакет ресурсов игры.</p>
        <label class="file-button" for="asset-file">Открыть пакет ресурсов ZIP</label>
        <input id="asset-file" type="file" accept=".zip,application/zip">
      </div>
    </div>
  </section>
  <section id="hud" hidden aria-label="Игровой интерфейс">
    <div class="mission"><small id="level-label"></small><strong id="objective">Найди артефакт</strong><span id="objective-distance"></span></div>
    <div class="top-actions">
      <button id="camera-switch" type="button" title="Камера (C)" aria-label="Сменить камеру">От 1-го лица</button>
      <div class="hero-choices" role="group" aria-label="Выбор героя">
        <button id="hero-gulman" type="button" title="Гульмэн (5)" aria-label="Выбрать Гульмэна (5)" aria-pressed="true">Гульмэн <kbd>5</kbd></button>
        <button id="hero-switch" type="button" title="Гульмоника (6)" aria-label="Выбрать Гульмонику (6)" aria-pressed="false">Гульмоника <kbd>6</kbd></button>
      </div>
      <button id="briefing-open" type="button" title="Брифинг">Брифинг</button>
      <button id="capture-mouse" type="button" hidden>Захватить мышь</button>
      <button id="pause-button" type="button" title="Пауза (Esc)" aria-label="Пауза">Ⅱ</button>
    </div>
    <img id="crosshair" alt="" width="53" height="49" aria-hidden="true"><div id="hitmarker" aria-hidden="true">×</div>
    <div id="prompt" role="status"></div>
    <div class="health">
      <span id="hero-name">Гульмэн</span><img id="health-icon" alt="Здоровье" width="124" height="137"><span id="health-value">100</span><i id="health-bar" hidden></i>
    </div>
    <div class="inventory">
      <div class="counter money"><span id="credits">$ 0</span><img id="money-icon" alt="Деньги" width="79" height="87"></div>
      <div class="counter ammo"><img id="ammo-icon" alt="Патроны" width="114" height="102"><span id="ammo-value">120</span></div>
      <div class="weapon"><img id="weapon-icon" alt="Оружие" width="177" height="95"><span id="weapon-name">Пистолет</span><span id="weapon-slots">1 · 2 · 3 · 4</span></div>
    </div>
    <div class="controls-hint">WASD — движение · E — действие · Shift — бег · Space — прыжок · 5 / 6 — герой · C — камера · M — карта</div>
    <canvas id="minimap" width="220" height="220" hidden aria-label="Карта уровня"></canvas>
    <div id="damage" aria-hidden="true"></div>
    <div id="touch-controls" aria-label="Сенсорное управление">
      <div id="touch-look" aria-hidden="true"></div>
      <div id="touch-stick" aria-label="Стик движения. Потяни до края для бега">
        <div class="stick-ring"><i></i></div><span>БЕГ</span>
      </div>
      <div class="touch-actions" role="group" aria-label="Действия">
        <button id="touch-interact" type="button" aria-label="Взаимодействовать"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9Z"/><path d="M12 9v6M9 12h6"/></svg></button>
        <button id="touch-jump" type="button" aria-label="Прыжок. Удерживай до приземления, веди пальцем для обзора"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17V4m-6 6 6-6 6 6M6 21h12"/></svg></button>
        <button id="touch-fire" type="button" aria-label="Стрелять. Веди пальцем по экрану для прицеливания"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/></svg></button>
      </div>
      <div class="touch-weapons" role="group" aria-label="Оружие">
        <button type="button" data-weapon="0" aria-label="Пистолет" aria-pressed="true"><img alt=""></button>
        <button type="button" data-weapon="1" aria-label="Автомат" aria-pressed="false"><img alt=""></button>
        <button type="button" data-weapon="2" aria-label="Гранаты" aria-pressed="false"><img alt=""></button>
        <button type="button" data-weapon="3" aria-label="БигГан" aria-pressed="false"><img alt=""></button>
      </div>
      <div class="touch-tools" role="group" aria-label="Камера, герой и карта">
        <button id="touch-camera" type="button" aria-label="Сменить камеру">1Л</button>
        <button id="touch-hero" type="button" aria-label="Сменить героя">Г</button>
        <button id="touch-map" type="button" aria-label="Карта" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3ZM9 3v15M15 6v15"/></svg></button>
        <button id="touch-briefing" type="button" aria-label="Брифинг"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6C9 4 6 4 3 5v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Zm0 0v14"/></svg></button>
        <button id="touch-pause" type="button" aria-label="Пауза">Ⅱ</button>
      </div>
    </div>
  </section>
  <div id="toast" role="status"></div>
  <section id="loading" hidden aria-label="Загрузка уровня" aria-live="polite"><div class="loading-content"><h2 id="loading-title">Загрузка уровня</h2><p id="loading-status" role="status">Подготовка игры…</p><div class="indeterminate" aria-hidden="true"></div></div></section>
  <button id="fullscreen" type="button" aria-label="На весь экран" aria-pressed="false" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="expand-icon" d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/><path class="collapse-icon" d="M4 9h5V4m11 5h-5V4M9 20v-5H4m11 5v-5h5"/></svg>
  </button>
  <button id="sound-unlock" type="button" hidden>Включить звук</button>
  <script type="module" src="./js/app.js?v=20261111-23"></script>
</body>
</html>
